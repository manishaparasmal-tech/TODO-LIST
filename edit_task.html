{% extends "base.html" %}
{% block title %}Edit task | TaskFlow{% endblock %}
{% block content %}<section class="container-fluid page-width form-page"><a class="back-link" href="{{ url_for('dashboard') }}"><i class="bi bi-arrow-left"></i> Back to overview</a><div class="form-heading"><div><div class="eyebrow"><span></span> Refine your plan</div><h1>Edit task</h1><p>Small adjustments keep your priorities honest.</p></div></div><form method="post" class="task-form" data-validate><div class="form-main"><div class="field"><label for="title">Task title <strong>*</strong></label><input id="title" name="title" type="text" maxlength="120" value="{{ task.title }}" required autofocus><small class="field-error"></small></div><div class="field"><label for="description">Description <span>(optional)</span></label><textarea id="description" name="description" rows="5" maxlength="500">{{ task.description or '' }}</textarea></div></div><div class="form-side"><div class="field"><label for="category">Category</label><select id="category" name="category">{% for option in ['College', 'Work', 'Personal', 'Shopping', 'Other'] %}<option value="{{ option }}" {% if task.category == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></div><div class="field"><label>Priority</label><div class="priority-options">{% for option, icon in [('High', '🔴'), ('Medium', '🟡'), ('Low', '🟢')] %}<label class="priority-choice"><input type="radio" name="priority" value="{{ option }}" {% if task.priority == option %}checked{% endif %}><span>{{ icon }} {{ option }}</span></label>{% endfor %}</div></div><div class="date-grid"><div class="field"><label for="due_date">Due date</label><input id="due_date" name="due_date" type="date" value="{{ task.due_date or '' }}" min="{{ today }}"></div><div class="field"><label for="due_time">Due time</label><input id="due_time" name="due_time" type="time" value="{{ task.due_time or '' }}"></div></div><div class="form-actions"><a class="btn btn-quiet" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit">Save changes <i class="bi bi-check2 ms-2"></i></button></div></div></form></section>{% endblock %}
