{% extends "base.html" %}
{% block title %}Create account | TaskFlow{% endblock %}
{% block content %}<section class="auth-page compact-auth container-fluid page-width"><div class="auth-panel mx-auto"><a class="back-link" href="{{ url_for('index') }}"><i class="bi bi-arrow-left"></i> Back to home</a><div class="panel-kicker">A fresh start</div><h2>Create your workspace</h2><p class="muted-copy">A few details, then your day gets clearer.</p><form method="post" class="stack-form" data-validate><div class="field"><label for="name">Your name</label><input id="name" name="name" type="text" value="{{ name|default('') }}" autocomplete="name" required minlength="2"><small class="field-error"></small></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ email|default('') }}" autocomplete="email" required><small class="field-error"></small></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="6"><small class="field-error"></small></div><button class="btn btn-primary btn-lg w-100" type="submit">Create account <i class="bi bi-arrow-up-right ms-2"></i></button></form><p class="panel-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
