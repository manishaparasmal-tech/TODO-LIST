{% extends "base.html" %}
{% block title %}Log in | TaskFlow{% endblock %}
{% block content %}<section class="auth-page compact-auth container-fluid page-width"><div class="auth-panel mx-auto"><a class="back-link" href="{{ url_for('index') }}"><i class="bi bi-arrow-left"></i> Back to home</a><div class="panel-kicker">Welcome back</div><h2>Pick up your flow</h2><p class="muted-copy">Your task list is waiting for you.</p><form method="post" class="stack-form" data-validate><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ email|default('') }}" required autocomplete="email"><small class="field-error"></small></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="6" autocomplete="current-password"><small class="field-error"></small></div><button class="btn btn-primary btn-lg w-100" type="submit">Log in <i class="bi bi-arrow-up-right ms-2"></i></button></form><p class="panel-foot">Need an account? <a href="{{ url_for('register') }}">Register here</a></p></div></section>{% endblock %}
